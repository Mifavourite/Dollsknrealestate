<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Find rental properties in St. Kitts & Nevis with Doll SKN Real Estate.">
  <title>Properties for Rent | Doll SKN Real Estate</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="header-placeholder"></div>

  <main>
    <section class="page-hero">
      <div class="container fade-in">
        <span class="eyebrow">Rent</span>
        <h1>Rental Properties</h1>
        <p class="lead">Quality homes and apartments for short-term and long-term stays in paradise.</p>
      </div>
    </section>

    <section>
      <div class="container">
        <div class="filter-bar fade-in">
          <select aria-label="Filter by location">
            <option>All Locations</option>
            <option>St. Kitts</option>
            <option>Nevis</option>
            <option>Frigate Bay</option>
            <option>Basseterre</option>
            <option>Half Way Tree</option>
          </select>
          <select aria-label="Filter by monthly rent">
            <option>Any Rent</option>
            <option>Under $1,500/mo</option>
            <option>$1,500 – $2,500/mo</option>
            <option>Over $2,500/mo</option>
          </select>
          <select aria-label="Filter by bedrooms">
            <option>Any Bedrooms</option>
            <option>1</option>
            <option>2</option>
            <option>3+</option>
          </select>
        </div>
        <div class="property-grid" id="property-grid" data-type="rent"></div>
      </div>
    </section>

    <section class="cta-banner">
      <div class="container fade-in">
        <h2>Looking for a Specific Rental?</h2>
        <p>Share your requirements and we'll match you with available properties.</p>
        <a href="contact.html" class="btn btn-gold">Inquire About Rentals</a>
      </div>
    </section>
  </main>

  <div id="footer-placeholder"></div>
  <script type="module" src="js/main.js"></script>
</body>
</html>
