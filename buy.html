<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Browse properties for sale in St. Kitts & Nevis with Doll SKN Real Estate.">
  <title>Properties for Sale | Doll SKN Real Estate</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="header-placeholder"></div>

  <main>
    <section class="page-hero">
      <div class="container fade-in">
        <span class="eyebrow">Buy</span>
        <h1>Properties for Sale</h1>
        <p class="lead">Discover your dream home or investment across St. Kitts & Nevis.</p>
      </div>
    </section>

    <section>
      <div class="container">
        <div class="filter-bar fade-in">
          <select aria-label="Filter by location">
            <option>All Locations</option>
            <option>St. Kitts</option>
            <option>Nevis</option>
            <option>Frigate Bay</option>
            <option>Basseterre</option>
          </select>
          <select aria-label="Filter by price">
            <option>Any Price</option>
            <option>Under $300,000</option>
            <option>$300,000 – $600,000</option>
            <option>$600,000 – $1,000,000</option>
            <option>Over $1,000,000</option>
          </select>
          <select aria-label="Filter by bedrooms">
            <option>Any Bedrooms</option>
            <option>1+</option>
            <option>2+</option>
            <option>3+</option>
            <option>4+</option>
          </select>
        </div>
        <div class="property-grid" id="property-grid" data-type="sale"></div>
      </div>
    </section>

    <section class="cta-banner">
      <div class="container fade-in">
        <h2>Don't See What You're Looking For?</h2>
        <p>Tell us your criteria and Adolceen will find properties that match your vision.</p>
        <a href="contact.html" class="btn btn-gold">Request a Custom Search</a>
      </div>
    </section>
  </main>

  <div id="footer-placeholder"></div>
  <script type="module" src="js/main.js"></script>
</body>
</html>
